<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comum :: cabecalho('Registrar ocorrência')}"></head>
<body>
<div class="aplicacao">

    <aside th:replace="~{fragmentos/comum :: lateral('ocorrencias')}"></aside>

    <main class="conteudo">
        <div class="conteudo-limite" style="max-width:720px">

            <div th:replace="~{fragmentos/comum :: avisos}"></div>

            <a class="voltar" th:href="@{/ferias/painel}">
                <svg th:replace="~{fragmentos/comum :: i('arrow-left')}"></svg> Férias
            </a>

            <div class="cabecalho">
                <div>
                    <h1>Registrar ocorrência</h1>
                    <p class="resumo">Férias, folgas, licenças, ausências e feriados trabalhados.</p>
                </div>
            </div>

            <div class="cartao">
                <div class="cartao-corpo">
                    <form th:action="@{/ocorrencias/pagina}" th:object="${novaOcorrencia}" method="post" class="formulario">

                        <div>
                            <label for="pessoa">Pessoa</label>
                            <select id="pessoa" name="pessoa">
                                <option value="">Sem pessoa vinculada (ocorrência de calendário)</option>
                                <option th:each="p : ${pessoas}"
                                        th:value="${p.id}"
                                        th:selected="${novaOcorrencia.pessoa != null and novaOcorrencia.pessoa.id == p.id}"
                                        th:text="${p.nome} + ' — ' + ${p.tipoVinculo.descricao}"></option>
                            </select>
                        </div>

                        <div>
                            <label for="tipo">Tipo de ocorrência</label>
                            <select id="tipo" th:field="*{tipo}" th:classappend="${#fields.hasErrors('tipo')} ? 'invalido'">
                                <option value="">Selecione</option>
                                <option th:each="t : ${tiposOcorrencia}" th:value="${t}" th:text="${t.descricao}"></option>
                            </select>
                            <span class="erro" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
                        </div>

                        <div class="campos">
                            <div>
                                <label for="dataInicio">Data de início</label>
                                <input type="date" id="dataInicio" th:field="*{dataInicio}"
                                       th:classappend="${#fields.hasErrors('dataInicio')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></span>
                            </div>
                            <div>
                                <label for="dataFim">Data de fim</label>
                                <input type="date" id="dataFim" th:field="*{dataFim}"
                                       th:classappend="${#fields.hasErrors('dataFim')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('dataFim')}" th:errors="*{dataFim}"></span>
                            </div>
                        </div>

                        <div>
                            <label for="situacao">Situação</label>
                            <select id="situacao" th:field="*{situacao}" th:classappend="${#fields.hasErrors('situacao')} ? 'invalido'">
                                <option th:each="s : ${situacoesOcorrencia}" th:value="${s}" th:text="${s.descricao}"></option>
                            </select>
                            <span class="erro" th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}"></span>
                        </div>

                        <div>
                            <label for="observacao">Observação</label>
                            <textarea id="observacao" rows="3" th:field="*{observacao}"
                                      th:classappend="${#fields.hasErrors('observacao')} ? 'invalido'"
                                      placeholder="Opcional: contexto, aprovação ou documento de referência"></textarea>
                            <span class="erro" th:if="${#fields.hasErrors('observacao')}" th:errors="*{observacao}"></span>
                        </div>

                        <div class="formulario-acoes">
                            <a class="botao" th:href="@{/ferias/painel}">Cancelar</a>
                            <button type="submit" class="botao primario">
                                <svg th:replace="~{fragmentos/comum :: i('circle-check')}"></svg> Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Saldo da pessoa escolhida, para evitar lançamento maior que o disponível -->
            <div class="informativo" th:if="${situacaoFerias != null}" th:with="s=${situacaoFerias}, urgente=${situacaoFerias.periodoMaisUrgente}">
                <svg th:replace="~{fragmentos/comum :: i('info')}"></svg>
                <div>
                    <span th:if="${!s.pessoa.possuiRegraDeFerias()}"
                          th:text="${s.pessoa.nome} + ' tem vínculo ' + ${s.pessoa.tipoVinculo.descricao} +
                                   ': sem regra de férias trabalhistas. Registre a pausa como folga ou licença.'"></span>
                    <span th:if="${s.pessoa.possuiRegraDeFerias() and urgente == null}"
                          th:text="'Sem saldo de férias disponível para ' + ${s.pessoa.nome} + '.'"></span>
                    <span th:if="${s.pessoa.possuiRegraDeFerias() and urgente != null}"
                          th:text="'Saldo disponível: ' + ${s.saldoTotal} + ' dias. O período mais antigo vence em ' +
                                   ${#temporals.format(urgente.dataLimiteGozo, 'dd/MM/yyyy')} + '.'"></span>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
