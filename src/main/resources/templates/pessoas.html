<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema KODIE - Cadastro de pessoas</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header class="topo">
    <h1>Sistema KODIE</h1>
    <p>Cadastro central de pessoas &middot; KODIE Academy</p>
</header>

<main class="conteudo">

    <p th:if="${mensagem}" th:text="${mensagem}" class="aviso ok"></p>
    <p th:if="${erro}" th:text="${erro}" class="aviso ruim"></p>

    <section class="cartao">
        <h2>Cadastrar pessoa</h2>

        <form th:action="@{/pessoas/pagina}" th:object="${novaPessoa}" method="post">
            <div class="campos">

                <div>
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Nome e sobrenome">
                    <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" th:field="*{cpf}" placeholder="Somente numeros" maxlength="11">
                    <span class="erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="nome@exemplo.com">
                    <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div>
                    <label for="cargo">Cargo</label>
                    <input type="text" id="cargo" th:field="*{cargo}" placeholder="Funcao exercida">
                    <span class="erro" th:if="${#fields.hasErrors('cargo')}" th:errors="*{cargo}"></span>
                </div>

                <div>
                    <label for="tipoVinculo">Tipo de vinculo</label>
                    <select id="tipoVinculo" th:field="*{tipoVinculo}">
                        <option value="">Selecione</option>
                        <option th:each="t : ${tiposVinculo}"
                                th:value="${t}" th:text="${t.descricao}"></option>
                    </select>
                    <span class="erro" th:if="${#fields.hasErrors('tipoVinculo')}" th:errors="*{tipoVinculo}"></span>
                </div>

                <div>
                    <label for="situacao">Situacao</label>
                    <select id="situacao" th:field="*{situacao}">
                        <option th:each="s : ${situacoesVinculo}"
                                th:value="${s}" th:text="${s.descricao}"></option>
                    </select>
                    <span class="erro" th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}"></span>
                </div>

                <div>
                    <label for="dataEntrada">Data de entrada</label>
                    <input type="date" id="dataEntrada" th:field="*{dataEntrada}">
                    <span class="erro" th:if="${#fields.hasErrors('dataEntrada')}" th:errors="*{dataEntrada}"></span>
                </div>

                <div>
                    <label for="dataSaida">Data de saida</label>
                    <input type="date" id="dataSaida" th:field="*{dataSaida}">
                    <span class="erro" th:if="${#fields.hasErrors('dataSaida')}" th:errors="*{dataSaida}"></span>
                </div>

            </div>
            <button type="submit">Salvar cadastro</button>
        </form>
    </section>

    <section class="cartao">
        <h2>Pessoas cadastradas</h2>

        <p th:if="${#lists.isEmpty(resumos)}" class="vazio">Nenhuma pessoa cadastrada ate o momento.</p>

        <table th:unless="${#lists.isEmpty(resumos)}">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Cargo</th>
                <th>Vinculo</th>
                <th>Situacao</th>
                <th>Entrada</th>
                <th>Ocorrencias</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${resumos}">
                <td>
                    <a th:href="@{/pessoas/pagina/{id}(id=${r.pessoa.id})}" th:text="${r.pessoa.nome}">Nome</a>
                </td>
                <td th:text="${r.pessoa.cargo}">Cargo</td>
                <td>
                    <span class="etiqueta"
                          th:classappend="${r.pessoa.tipoVinculo.name() == 'CLT'} ? 'clt' : ''"
                          th:text="${r.pessoa.tipoVinculo.descricao}">Vinculo</span>
                </td>
                <td>
                    <span class="etiqueta"
                          th:classappend="${#strings.toLowerCase(r.pessoa.situacao.name())}"
                          th:text="${r.pessoa.situacao.descricao}">Situacao</span>
                </td>
                <td th:text="${#temporals.format(r.pessoa.dataEntrada, 'dd/MM/yyyy')}">00/00/0000</td>
                <td th:text="${r.totalOcorrencias}">0</td>
                <td>
                    <form th:action="@{/pessoas/pagina/{id}/excluir(id=${r.pessoa.id})}" method="post">
                        <button type="submit" class="discreto">excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

</main>
</body>
</html>
