<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comum :: cabecalho('Pessoas')}"></head>
<body>
<div class="aplicacao">

    <aside th:replace="~{fragmentos/comum :: lateral('pessoas')}"></aside>

    <main class="conteudo">
        <div class="conteudo-limite">

            <div th:replace="~{fragmentos/comum :: avisos}"></div>

            <div class="cabecalho">
                <div>
                    <h1>Pessoas</h1>
                    <p class="resumo">
                        <span th:text="${totalCadastrado}">0</span> cadastradas ·
                        <span th:text="${totalAtivo}">0</span> ativas
                    </p>
                </div>
                <div class="acoes">
                    <a class="botao" th:href="@{/exportacao/pessoas.csv(busca=${busca},vinculo=${vinculoFiltro},situacao=${situacaoFiltro})}">
                        <svg th:replace="~{fragmentos/comum :: i('download')}"></svg> Exportar CSV
                    </a>
                    <a th:if="${ehAdmin}" class="botao primario" href="#cadastro">
                        <svg th:replace="~{fragmentos/comum :: i('user-plus')}"></svg> Nova pessoa
                    </a>
                </div>
            </div>

            <!-- Busca e filtros: enviados por GET para que a URL continue compartilhável -->
            <form class="filtros" method="get" th:action="@{/pessoas/pagina}">
                <div class="campo-busca">
                    <svg th:replace="~{fragmentos/comum :: i('search')}"></svg>
                    <input type="search" name="busca" th:value="${busca}" placeholder="Buscar por nome, e-mail ou cargo" aria-label="Buscar">
                </div>
                <select name="vinculo" onchange="this.form.submit()" aria-label="Vínculo">
                    <option value="">Vínculo: todos</option>
                    <option th:each="t : ${tiposVinculo}" th:value="${t}" th:text="${t.descricao}"
                            th:selected="${t == vinculoFiltro}"></option>
                </select>
                <select name="situacao" onchange="this.form.submit()" aria-label="Situação">
                    <option value="">Situação: todas</option>
                    <option th:each="s : ${situacoesVinculo}" th:value="${s}" th:text="${s.descricao}"
                            th:selected="${s == situacaoFiltro}"></option>
                </select>
                <button type="submit" class="botao">Filtrar</button>
                <a th:if="${filtrando}" class="botao fantasma" th:href="@{/pessoas/pagina}">Limpar</a>
            </form>

            <div class="quadro">
                <table>
                    <thead>
                    <tr>
                        <th>Pessoa</th>
                        <th>Cargo</th>
                        <th>Vínculo</th>
                        <th>Entrada</th>
                        <th class="direita">Ocorrências</th>
                        <th>Situação</th>
                        <th th:if="${ehAdmin}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(resumos)}">
                        <td th:colspan="${ehAdmin} ? 7 : 6">
                            <div class="vazio">
                                <svg th:replace="~{fragmentos/comum :: i('users')}"></svg>
                                <span th:text="${filtrando} ? 'Nenhuma pessoa corresponde aos filtros aplicados.'
                                                           : 'Nenhuma pessoa cadastrada até o momento.'">vazio</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="r : ${resumos}">
                        <td>
                            <a class="pessoa-celula" th:href="@{/pessoas/pagina/{id}(id=${r.pessoa.id})}">
                                <span class="avatar" th:classappend="${r.pessoa.corAvatar}" th:text="${r.pessoa.iniciais}">AB</span>
                                <span style="min-width:0">
                                    <span class="nome" th:text="${r.pessoa.nome}" style="display:block">Nome</span>
                                    <span class="sub" th:text="${r.pessoa.email}" style="display:block">email</span>
                                </span>
                            </a>
                        </td>
                        <td th:text="${r.pessoa.cargo}">Cargo</td>
                        <td>
                            <span class="etiqueta sem-ponto" th:classappend="${r.pessoa.possuiRegraDeFerias()} ? 'azul'"
                                  th:text="${r.pessoa.tipoVinculo.descricao}">Vínculo</span>
                        </td>
                        <td class="numerico" th:text="${#temporals.format(r.pessoa.dataEntrada, 'dd/MM/yyyy')}">00/00/0000</td>
                        <td class="numerico direita" th:text="${r.totalOcorrencias}">0</td>
                        <td>
                            <span class="etiqueta"
                                  th:classappend="${r.pessoa.situacao.name() == 'ATIVO'} ? 'verde'
                                                : (${r.pessoa.situacao.name() == 'AFASTADO'} ? 'ambar'
                                                : (${r.pessoa.situacao.name() == 'DESLIGADO'} ? 'vermelha' : ''))"
                                  th:text="${r.pessoa.situacao.descricao}">Situação</span>
                        </td>
                        <td th:if="${ehAdmin}" class="direita">
                            <form th:action="@{/pessoas/pagina/{id}/excluir(id=${r.pessoa.id})}" method="post"
                                  onsubmit="return confirm('Excluir esta pessoa e todas as ocorrências dela?')">
                                <button type="submit" class="botao texto" title="Excluir">
                                    <svg th:replace="~{fragmentos/comum :: i('trash-2')}"></svg>
                                    <span class="visualmente-oculto">Excluir</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="quadro-rodape" th:unless="${#lists.isEmpty(resumos)}">
                    <span th:text="'Exibindo ' + ${#lists.size(resumos)} + ' de ' + ${totalCadastrado}">Exibindo</span>
                </div>
            </div>

            <section class="cartao" id="cadastro" style="margin-top:24px" th:if="${ehAdmin}">
                <div class="cartao-titulo">
                    <span class="titulo-com-icone"><svg th:replace="~{fragmentos/comum :: i('user-plus')}"></svg> Cadastrar pessoa</span>
                </div>
                <div class="cartao-corpo">
                    <form th:action="@{/pessoas/pagina}" th:object="${novaPessoa}" method="post" class="formulario">

                        <div class="campos">
                            <div>
                                <label for="nome">Nome completo</label>
                                <input type="text" id="nome" th:field="*{nome}" placeholder="Nome e sobrenome"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                            </div>
                            <div>
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" th:field="*{cpf}" maxlength="11" placeholder="Somente números" inputmode="numeric"
                                       th:classappend="${#fields.hasErrors('cpf')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
                            </div>
                            <div>
                                <label for="email">E-mail</label>
                                <input type="email" id="email" th:field="*{email}" placeholder="nome@exemplo.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            <div>
                                <label for="cargo">Cargo</label>
                                <input type="text" id="cargo" th:field="*{cargo}" placeholder="Função exercida"
                                       th:classappend="${#fields.hasErrors('cargo')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('cargo')}" th:errors="*{cargo}"></span>
                            </div>
                            <div>
                                <label for="tipoVinculo">Tipo de vínculo</label>
                                <select id="tipoVinculo" th:field="*{tipoVinculo}"
                                        th:classappend="${#fields.hasErrors('tipoVinculo')} ? 'invalido'">
                                    <option value="">Selecione</option>
                                    <option th:each="t : ${tiposVinculo}" th:value="${t}" th:text="${t.descricao}"></option>
                                </select>
                                <span class="erro" th:if="${#fields.hasErrors('tipoVinculo')}" th:errors="*{tipoVinculo}"></span>
                            </div>
                            <div>
                                <label for="situacao">Situação</label>
                                <select id="situacao" th:field="*{situacao}"
                                        th:classappend="${#fields.hasErrors('situacao')} ? 'invalido'">
                                    <option th:each="s : ${situacoesVinculo}" th:value="${s}" th:text="${s.descricao}"></option>
                                </select>
                                <span class="erro" th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}"></span>
                            </div>
                            <div>
                                <label for="dataEntrada">Data de entrada</label>
                                <input type="date" id="dataEntrada" th:field="*{dataEntrada}"
                                       th:classappend="${#fields.hasErrors('dataEntrada')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('dataEntrada')}" th:errors="*{dataEntrada}"></span>
                            </div>
                            <div>
                                <label for="dataSaida">Data de saída</label>
                                <input type="date" id="dataSaida" th:field="*{dataSaida}"
                                       th:classappend="${#fields.hasErrors('dataSaida')} ? 'invalido'">
                                <span class="erro" th:if="${#fields.hasErrors('dataSaida')}" th:errors="*{dataSaida}"></span>
                            </div>
                        </div>

                        <div class="formulario-acoes">
                            <button type="submit" class="botao primario">
                                <svg th:replace="~{fragmentos/comum :: i('plus')}"></svg> Salvar cadastro
                            </button>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>
</div>
</body>
</html>
