<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<!--
    Fragmentos compartilhados por todas as telas.
    Manter a navegacao num unico arquivo evita que ela saia de sincronia
    entre as paginas.
-->
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Sistema KODIE - ' + ${titulo}">Sistema KODIE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

<aside class="lateral" th:fragment="lateral(ativo)">
    <div class="lateral-marca">
        <div class="nome">KODIE</div>
        <div class="descricao">Gestao de pessoas</div>
    </div>

    <nav class="lateral-menu">
        <a th:href="@{/pessoas/pagina}" th:classappend="${ativo == 'pessoas'} ? 'ativo'">Pessoas</a>
        <a th:href="@{/ferias/painel}" th:classappend="${ativo == 'ferias'} ? 'ativo'">Ferias</a>
        <a th:if="${ehAdmin}" th:href="@{/ocorrencias/pagina/nova}" th:classappend="${ativo == 'ocorrencias'} ? 'ativo'">Ocorrencias</a>
        <a th:href="@{/calendario/pagina}" th:classappend="${ativo == 'calendario'} ? 'ativo'">Calendario</a>
        <a th:href="@{/indicadores/pagina}" th:classappend="${ativo == 'indicadores'} ? 'ativo'">Indicadores</a>
        <a th:if="${ehAdmin}" th:href="@{/usuarios/pagina}" th:classappend="${ativo == 'acessos'} ? 'ativo'">Acessos</a>
        <a th:if="${ehAdmin}" th:href="@{/backup/pagina}" th:classappend="${ativo == 'backup'} ? 'ativo'">Backup</a>
    </nav>

    <div class="lateral-rodape" th:if="${usuarioLogado != null}">
        <div class="usuario">
            <div class="inicial" th:text="${usuarioLogado.iniciais}">AD</div>
            <div class="identificacao">
                <div class="nome" th:text="${usuarioLogado.nome}">Nome</div>
                <div class="papel" th:text="${usuarioLogado.perfil.descricao}">Perfil</div>
            </div>
        </div>
        <div class="conta">
            <a th:href="@{/conta/senha}" th:classappend="${ativo == 'conta'} ? 'ativo'">Minha senha</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Sair</button>
            </form>
        </div>
    </div>
</aside>

<!-- Mensagens de sucesso e erro vindas do redirect -->
<div th:fragment="avisos">
    <p th:if="${mensagem}" th:text="${mensagem}" class="aviso ok"></p>
    <p th:if="${erro}" th:text="${erro}" class="aviso ruim"></p>
</div>

</body>
</html>
