# ============================================================
# Perfil de producao - ativado com SPRING_PROFILES_ACTIVE=prod
#
# Tudo o que nao esta aqui e herdado de application.properties.
# Nenhuma credencial fica no codigo: todas vem de variaveis de
# ambiente definidas no servidor.
# ============================================================

# PostgreSQL. A URL precisa estar no formato JDBC:
#   jdbc:postgresql://servidor:5432/banco
# Alguns provedores entregam "postgres://usuario:senha@servidor/banco";
# esse formato precisa ser convertido.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Planos gratuitos limitam as conexoes simultaneas; poucas bastam ao KODIE.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1

# Exposicao minima
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Banco real: sem dados ficticios, a menos que se peca explicitamente
kodie.dados-demonstracao=${KODIE_DADOS_DEMONSTRACAO:false}

# A maioria das hospedagens informa a porta por esta variavel
server.port=${PORT:8080}
