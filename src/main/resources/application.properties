spring.application.name=kodie

# ------------------------------------------------------------
# Banco de dados - desenvolvimento local
#
# H2 gravado em arquivo: os dados sobrevivem ao fechamento da
# aplicacao. A pasta fica fora do Git (.gitignore) e pode ser
# trocada pela variavel de ambiente KODIE_DADOS_DIR.
# Em producao, o perfil "prod" troca para PostgreSQL.
#
# WRITE_DELAY=0: grava no arquivo a cada transacao confirmada. Por
# padrao o H2 acumula ate 500 ms de gravacoes, e uma queda abrupta
# nessa janela perderia registros que ja tinham sido confirmados.
# ------------------------------------------------------------
kodie.dados.diretorio=${KODIE_DADOS_DIR:./dados}
spring.datasource.url=jdbc:h2:file:${kodie.dados.diretorio}/kodiedb;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

# O schema e criado e evoluido pelo Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas, e
# recusa subir se nao baterem - ele nunca altera o banco por conta propria.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Console web do H2 (restrito ao administrador pelo SegurancaConfig)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: recarrega template sem reiniciar a aplicacao
spring.thymeleaf.cache=false

# ------------------------------------------------------------
# Carga de demonstracao (DataLoader)
#
# Aplicada somente quando o cadastro esta vazio - na primeira
# execucao, ou depois de apagar a pasta de dados. Nunca duplica.
# ------------------------------------------------------------
kodie.dados-demonstracao=${KODIE_DADOS_DEMONSTRACAO:true}

# Controle de ferias
# Antecedencia, em dias, do alerta de vencimento do periodo concessivo.
kodie.ferias.dias-alerta-vencimento=90

# Administrador inicial
# Criado apenas quando nao existe nenhum usuario. No servidor, defina as
# variaveis de ambiente KODIE_ADMIN_LOGIN e KODIE_ADMIN_SENHA: a senha
# padrao abaixo serve so para desenvolvimento e correcao.
kodie.admin.login=${KODIE_ADMIN_LOGIN:admin}
kodie.admin.nome=${KODIE_ADMIN_NOME:Administrador}
kodie.admin.senha=${KODIE_ADMIN_SENHA:kodie2026}

# ------------------------------------------------------------
# Backup
#
# Pasta dos backups gravados no servidor (fora do Git). Na VPS,
# o conteudo desta pasta deve ser copiado para FORA da maquina:
# backup guardado so no mesmo disco do banco nao protege contra
# a perda do disco.
# ------------------------------------------------------------
kodie.backup.diretorio=${KODIE_BACKUP_DIR:./backups}
# Backup automatico: todo dia as 3h (horario de Sao Paulo)
kodie.backup.agendamento=${KODIE_BACKUP_AGENDAMENTO:0 0 3 * * *}
# Quantos backups automaticos manter; os mais antigos sao apagados
kodie.backup.manter=${KODIE_BACKUP_MANTER:14}

# Tamanho maximo do arquivo de backup enviado para restauracao
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
