spring.application.name=kodie

# Banco em memoria H2
spring.datasource.url=jdbc:h2:mem:kodiedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: recarrega template sem reiniciar a aplicacao
spring.thymeleaf.cache=false

# Controle de ferias
# Antecedencia, em dias, do alerta de vencimento do periodo concessivo.
kodie.ferias.dias-alerta-vencimento=90
