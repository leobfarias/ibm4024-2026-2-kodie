spring.application.name=kodie

# Banco em memoria H2
spring.datasource.url=jdbc:h2:mem:kodiedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: recarrega template sem reiniciar a aplicacao
spring.thymeleaf.cache=false

# Controle de ferias
# Antecedencia, em dias, do alerta de vencimento do periodo concessivo.
kodie.ferias.dias-alerta-vencimento=90

# Administrador inicial
# Criado apenas quando nao existe nenhum usuario. No servidor, defina as
# variaveis de ambiente KODIE_ADMIN_LOGIN e KODIE_ADMIN_SENHA: a senha
# padrao abaixo serve so para desenvolvimento e correcao.
kodie.admin.login=${KODIE_ADMIN_LOGIN:admin}
kodie.admin.nome=${KODIE_ADMIN_NOME:Administrador}
kodie.admin.senha=${KODIE_ADMIN_SENHA:kodie2026}
